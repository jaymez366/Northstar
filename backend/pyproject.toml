[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-backend"
version = "0.1.0"
description = "FastAPI foundation for NorthStar B2B Employee Communication"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "supabase>=2.10,<3.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "httpx>=0.27,<1.0",
  "redis>=5.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
